<article class="notification-item {% if not notice.is_read %}unread{% endif %}"
         data-notice>
  <div class="notification-item-icon">
    <i aria-hidden="true" class="bi bi-bell">
    </i>
  </div>
  <div class="flex-grow-1">
    <h3>{{ notice.title }}</h3>
    <p>{{ notice.message }}</p>
    <small>{{ notice.created_at|date:'d M Y, h:i A' }}</small>
  </div>
  {% if not notice.is_read %}
    <form method="post"
          action="{% url 'notification_read' notice.pk %}"
          data-notification-form>
      {% csrf_token %}
      <button class="btn btn-sm btn-light">Mark read</button>
    </form>
  {% else %}
    <span class="text-muted small">
      <i aria-hidden="true" class="bi bi-check2">
      </i> Read</span>
  {% endif %}
</article>
