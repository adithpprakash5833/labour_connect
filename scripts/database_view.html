<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labour Connect — Database</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#f3f6fa;color:#192b41}header{background:#142c43;color:white;padding:25px 32px}h1{font-size:24px;margin:0 0 8px}header p{color:#c3d7e7;margin:0;line-height:1.6}.badge{display:inline-block;background:#d8f7e9;color:#116847;border-radius:20px;padding:4px 10px;font-size:12px;margin-left:12px;vertical-align:middle}.stats{display:flex;gap:18px;padding:20px 32px}.stat{background:white;border:1px solid #dce4ed;border-radius:10px;padding:15px 23px}.stat strong{font-size:25px;display:block}.stat span{color:#65778b}main{display:grid;grid-template-columns:285px minmax(0,1fr);gap:20px;padding:0 32px 32px}aside,section{background:white;border:1px solid #dce4ed;border-radius:10px;overflow:hidden}aside{padding:15px}input{width:100%;border:1px solid #ccd6e1;border-radius:6px;padding:10px;font:inherit;margin-bottom:12px}button.table{display:flex;justify-content:space-between;gap:8px;text-align:left;width:100%;padding:10px 7px;background:transparent;border:0;border-radius:5px;color:#283e55;cursor:pointer;font:12px ui-monospace,monospace}button.table.active{background:#e7f1fb;color:#0757a2;font-weight:700}button.table:hover{background:#f0f5fa}.count{color:#74869a}section .top{padding:20px;border-bottom:1px solid #e2e8f0}h2{font-size:19px;margin:0 0 6px}.note{color:#65778b;font-size:12px}.scroll{overflow:auto;max-height:560px}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:12px}th{position:sticky;top:0;background:#edf3f8;z-index:1;text-align:left;padding:13px 15px;border-bottom:1px solid #d3dfe9}td{padding:11px 15px;border-bottom:1px solid #edf1f5;max-width:350px;overflow:hidden;text-overflow:ellipsis}tr:nth-child(even){background:#fafcfe}.null{color:#91a0af;font-style:italic}.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{border:1px solid #ccd6e1;background:white;padding:7px 13px;border-radius:5px;cursor:pointer}.tabs button.selected{background:#142c43;color:white;border-color:#142c43}.empty{padding:25px;color:#65778b}@media(max-width:800px){main{grid-template-columns:1fr;padding:0 12px 20px}.stats{padding:15px 12px}header{padding:20px}aside{max-height:240px;overflow:auto}}
</style></head><body><header><h1>Labour Connect database <span class="badge">Read-only preview</span></h1><p>Actual records from the MySQL database in your project ZIP. Select a table to inspect its data or columns.</p></header><div class="stats"><div class="stat"><strong id="tables"></strong><span>Tables</span></div><div class="stat"><strong id="users"></strong><span>User accounts</span></div><div class="stat"><strong id="workers"></strong><span>Worker profiles</span></div></div><main><aside><input id="tableSearch" placeholder="Find a table" aria-label="Find a table"><div id="tableList"></div></aside><section><div class="top"><h2 id="name"></h2><div id="info" class="note"></div><div class="tabs"><button id="dataTab" class="selected">Data</button><button id="schemaTab">Columns</button></div></div><div class="scroll" id="grid"></div></section></main><script>
const tables=__DATABASE_DATA__;
let selected=tables.find(t=>t.name==='accounts_user')||tables[0],mode='data';
const $=id=>document.getElementById(id);function escapeText(v){const e=document.createElement('span');e.textContent=v;return e.innerHTML}function count(name){return tables.find(t=>t.name===name)?.count||0}
$('tables').textContent=tables.length;$('users').textContent=count('accounts_user');$('workers').textContent=count('workers_workerprofile');
function list(){const q=$('tableSearch').value.toLowerCase();$('tableList').replaceChildren();tables.filter(t=>t.name.toLowerCase().includes(q)).forEach(t=>{const b=document.createElement('button');b.className='table'+(t===selected?' active':'');const label=document.createElement('span');label.textContent=t.name;const n=document.createElement('span');n.className='count';n.textContent=t.count;b.append(label,n);b.onclick=()=>{selected=t;list();draw()};$('tableList').append(b)})}
function draw(){$('name').textContent=selected.name;$('info').textContent=`${selected.count} records · Showing up to 200 rows. Password hashes and session secrets are omitted.`;$('dataTab').classList.toggle('selected',mode==='data');$('schemaTab').classList.toggle('selected',mode==='schema');const columns=mode==='data'?selected.visible:['Column','MySQL type'];const rows=mode==='data'?selected.rows:selected.columns.map(c=>[c.name,c.type]);$('grid').innerHTML='<table><thead><tr>'+columns.map(c=>'<th>'+escapeText(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td'+(v===null?' class="null"':'')+'>'+escapeText(v===null?'NULL':v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(rows.length?'':'<p class="empty">This table has no records.</p>')}
$('tableSearch').oninput=list;$('dataTab').onclick=()=>{mode='data';draw()};$('schemaTab').onclick=()=>{mode='schema';draw()};list();draw();
</script></body></html>
