      <span class="brand-mark">
        <i aria-hidden="true" class="bi bi-intersect">
        </i>
      </span>
      <span>labour<span class="brand-light">connect</span>
        <small>LOCAL SKILLS. REAL CONNECTIONS.</small>
      </span>

            </i>
          </a>

          <a class="nav-link login-link" href="{% url 'login' %}">Log in</a>
