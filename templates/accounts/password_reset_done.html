{% extends "base/base.html" %}
{% block content %}
  <section class="container section narrow">
    <div class="auth-card centered">
      <div class="success-symbol">
        <i class="bi bi-check2-circle">
        </i>
      </div>
      <h1>Check your inbox</h1>
      <p>If an active account uses this email, a reset link has been sent. In console email mode, your administrator can find it in the server terminal.</p>
      <a class="btn btn-primary" href='{% url 'login' %}'>Back to sign in</a>
    </div>
  </section>
{% endblock %}
